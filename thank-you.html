<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Cedaron Hills Business Solutions</title>

    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8fafc;
            color: #071a33;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .thank-you-box {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 55px 40px;
            text-align: center;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.10);
            border: 1px solid #e2e8f0;
        }

        .check {
            width: 64px;
            height: 64px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #e0f7fa;
            color: #0891b2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 13px 24px;
            background: #0891b2;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
        }

        .btn:hover {
            background: #0e7490;
        }

        @media (max-width: 600px) {

            .thank-you-box {
                padding: 40px 25px;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>

    <div class="thank-you-box">

        <div class="check">
            ✓
        </div>

        <h1>
            Thank You!
        </h1>

        <p>
            Your message has been received successfully.
            Our team will review your enquiry and get back
            to you within 24 hours.
        </p>

        <a href="index.html" class="btn">
            Back to Website
        </a>

    </div>

</body>

</html>
